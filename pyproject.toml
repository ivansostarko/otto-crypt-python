[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otto-crypt-py"
version = "0.1.0"
description = "OTTO Crypt Python: AES-256-GCM + HKDF-SIV style streaming AEAD with X25519 and Argon2id; compatible with Laravel OTTO package."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ivan Sostarko"}]
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41.0.0",
  "pynacl>=1.5.0"
]

[project.urls]
Homepage = "https://github.com/ivansostarko/otto-crypt-python"
